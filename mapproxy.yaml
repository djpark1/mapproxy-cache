services:
  demo:
  tms:
    use_grid_names: true
  wmts:
  wms:
    srs: ["EPSG:3857", "EPSG:900913", "EPSG:4326"]
    image_formats: ["image/png", "image/jpeg"]
    md:
      title: MapProxy Cache Server
      abstract: geolab-app GSS WMS caching proxy

layers:
  - name: scl_facility
    title: scl_facility
    sources: [scl_facility_cache]
  - name: scl_basemap
    title: scl_basemap
    sources: [scl_basemap_cache]
  - name: scl_fac_grade
    title: scl_fac_grade
    sources: [scl_fac_grade_cache]
  - name: scl_etc
    title: scl_etc
    sources: [scl_etc_cache]
  - name: scl_user_fac
    title: scl_user_fac
    sources: [scl_user_fac_cache]
  - name: scl_demand_point
    title: scl_demand_point
    sources: [scl_demand_point_cache]

caches:
  scl_facility_cache:
    grids: [webmercator]
    sources: [scl_facility_wms]
    format: image/png
  scl_basemap_cache:
    grids: [webmercator]
    sources: [scl_basemap_wms]
    format: image/png
  scl_fac_grade_cache:
    grids: [webmercator]
    sources: [scl_fac_grade_wms]
    format: image/png
  scl_etc_cache:
    grids: [webmercator]
    sources: [scl_etc_wms]
    format: image/png
  scl_user_fac_cache:
    grids: [webmercator]
    sources: [scl_user_fac_wms]
    format: image/png
  scl_demand_point_cache:
    grids: [webmercator]
    sources: [scl_demand_point_wms]
    format: image/png

sources:
  scl_facility_wms:
    type: wms
    req:
      url: http://59.6.157.153:8090/gssogc
      layers: scl_facility
      transparent: true
      format: image/png
    forward_req_params: [cql_filter]
    wms_opts:
      version: 1.3.0
    supported_srs: ["EPSG:3857", "EPSG:900913", "EPSG:4326"]

  scl_basemap_wms:
    type: wms
    req:
      url: http://59.6.157.153:8090/gssogc
      layers: scl_basemap
      transparent: true
      format: image/png
    forward_req_params: [cql_filter]
    wms_opts:
      version: 1.3.0
    supported_srs: ["EPSG:3857", "EPSG:900913", "EPSG:4326"]

  scl_fac_grade_wms:
    type: wms
    req:
      url: http://59.6.157.153:8090/gssogc
      layers: scl_fac_grade
      transparent: true
      format: image/png
    forward_req_params: [cql_filter]
    wms_opts:
      version: 1.3.0
    supported_srs: ["EPSG:3857", "EPSG:900913", "EPSG:4326"]

  scl_etc_wms:
    type: wms
    req:
      url: http://59.6.157.153:8090/gssogc
      layers: scl_etc
      transparent: true
      format: image/png
    forward_req_params: [cql_filter]
    wms_opts:
      version: 1.3.0
    supported_srs: ["EPSG:3857", "EPSG:900913", "EPSG:4326"]

  scl_user_fac_wms:
    type: wms
    req:
      url: http://59.6.157.153:8090/gssogc
      layers: scl_user_fac
      transparent: true
      format: image/png
    forward_req_params: [cql_filter]
    wms_opts:
      version: 1.3.0
    supported_srs: ["EPSG:3857", "EPSG:900913", "EPSG:4326"]

  scl_demand_point_wms:
    type: wms
    req:
      url: http://59.6.157.153:8090/gssogc
      layers: scl_demand_point
      transparent: true
      format: image/png
    forward_req_params: [cql_filter]
    wms_opts:
      version: 1.3.0
    supported_srs: ["EPSG:3857", "EPSG:900913", "EPSG:4326"]

grids:
  webmercator:
    base: GLOBAL_WEBMERCATOR
    origin: nw
    srs: "EPSG:900913"

globals:
  cache:
    base_dir: ./cache_data
    lock_dir: ./cache_data/locks
